name: ACMA Daily Crawler

on:
  schedule:
    - cron: '0 3 * * *'
  
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest # 깃허브의 우분투 리눅스 컴퓨터를 빌리겠다는 뜻

    steps:
    - name:  소스코드 가져오기
      uses: actions/checkout@v3

    - name:  파이썬 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 

    - name:  필요한 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name:  크롤러 실행!
      env:
        # 아까 3단계에서 깃허브 Secrets에 숨겨둔 몽고DB 주소를 가져와서 꽂아줌
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: |
        # 실행할 파이썬 파일 이름
        python saramin_scraper.py